name: Payitoff
description: >-
  Payitoff is an embedded-fintech platform that helps banks, lenders, credit
  unions, and fintech apps guide their customers through debt management and
  student-loan optimization. Its embeddable widgets and partner API let
  institutions surface personalized debt-payoff plans, federal student-loan
  repayment and forgiveness enrollment (IDR/PSLF), refinancing guidance, and
  consolidation workflows directly inside their own digital experiences.
  Payitoff was acquired by Array, the embeddable finance and consumer-credit
  platform, where it now powers the Student Loan Aid and broader debt product
  suite delivered through Array's embed layer. The developer surface is a
  partner-gated platform (sandbox, embed SDK, and partner portal) rather than a
  fully public, self-serve API. Payitoff is backed by Lightspeed Venture
  Partners.
